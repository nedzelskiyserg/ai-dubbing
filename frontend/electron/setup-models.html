<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Dubbing Studio — Загрузка моделей</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1A1A1A;
      color: #E0E0E0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag;
    }
    .container {
      width: 460px;
      padding: 36px;
      -webkit-app-region: no-drag;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 28px;
    }
    .steps {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .step-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
      transition: all 0.3s;
    }
    .step.active .step-icon  { border-color: #4FC3F7; background: rgba(79,195,247,0.15); color: #4FC3F7; }
    .step.done   .step-icon  { border-color: #66BB6A; background: rgba(102,187,106,0.15); color: #66BB6A; }
    .step.error  .step-icon  { border-color: #EF5350; background: rgba(239,83,80,0.15); color: #EF5350; }
    .step-label {
      font-size: 14px;
      color: #AAA;
      transition: color 0.3s;
    }
    .step.active .step-label { color: #FFF; }
    .step.done   .step-label { color: #66BB6A; }
    .step.error  .step-label { color: #EF5350; }
    .progress-bar-wrap {
      width: 100%;
      height: 6px;
      background: #333;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4FC3F7, #29B6F6);
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    .log {
      font-size: 12px;
      color: #777;
      height: 18px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 20px;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
    }
    .btn-skip {
      padding: 8px 20px;
      border: 1px solid #555;
      border-radius: 6px;
      background: transparent;
      color: #AAA;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-skip:hover { border-color: #888; color: #FFF; }
    .error-box {
      display: none;
      background: rgba(239,83,80,0.1);
      border: 1px solid rgba(239,83,80,0.3);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #EF9A9A;
      word-break: break-word;
      max-height: 80px;
      overflow-y: auto;
    }
    .error-box.visible { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Подготовка к работе</h1>
    <p class="subtitle">Установка компонентов и загрузка моделей. Это делается один раз.</p>

    <div class="steps">
      <div class="step" id="step-packages" style="display:none">
        <div class="step-icon">1</div>
        <div class="step-label">Обновление Python-зависимостей</div>
      </div>
      <div class="step" id="step-models-whisper">
        <div class="step-icon" id="icon-whisper">1</div>
        <div class="step-label">Whisper large-v3 — распознавание речи (~3 ГБ)</div>
      </div>
      <div class="step" id="step-models-tts">
        <div class="step-icon" id="icon-tts">2</div>
        <div class="step-label">F5-TTS — синтез речи (~4 ГБ)</div>
      </div>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="log" id="logLine">&nbsp;</div>

    <div class="error-box" id="errorBox"></div>

    <div class="actions">
      <button class="btn-skip" id="btnSkip" onclick="window.setupAPI.cancel()">Пропустить</button>
    </div>
  </div>

  <script>
    let STEPS = ['models-whisper', 'models-tts'];
    let stepWeights = { 'models-whisper': 40, 'models-tts': 60 };
    const stepPercents = {};

    // Показать шаг packages если main.js сообщит о нём
    window.setupAPI.onInitSteps && window.setupAPI.onInitSteps((hasPackages) => {
      if (hasPackages) {
        STEPS = ['packages', 'models-whisper', 'models-tts'];
        stepWeights = { 'packages': 15, 'models-whisper': 35, 'models-tts': 50 };
        stepPercents['packages'] = 0;
        const pkgEl = document.getElementById('step-packages');
        pkgEl.style.display = '';
        // Перенумеровать шаги
        document.getElementById('icon-whisper').textContent = '2';
        document.getElementById('icon-tts').textContent = '3';
      }
    });

    STEPS.forEach(s => { stepPercents[s] = 0; });

    function updateOverallProgress() {
      let total = 0;
      for (const s of STEPS) {
        total += (stepPercents[s] / 100) * stepWeights[s];
      }
      document.getElementById('progressBar').style.width = Math.round(total) + '%';
    }

    function setStepState(stepName, state) {
      const el = document.getElementById('step-' + stepName);
      if (!el) return;
      el.className = 'step ' + state;
      const icon = el.querySelector('.step-icon');
      if (state === 'done') icon.textContent = '\u2713';
      else if (state === 'error') icon.textContent = '\u2717';
    }

    let currentStep = null;

    window.setupAPI.onProgress((step, percent, message) => {
      if (step !== currentStep) {
        if (currentStep && stepPercents[currentStep] >= 100) setStepState(currentStep, 'done');
        currentStep = step;
        if (percent < 100) setStepState(step, 'active');
      }
      stepPercents[step] = percent;
      if (percent >= 100) setStepState(step, 'done');
      updateOverallProgress();
      document.getElementById('logLine').textContent = message || '';
    });

    window.setupAPI.onComplete(() => {
      STEPS.forEach(s => setStepState(s, 'done'));
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('logLine').textContent = 'Модели загружены! Запуск приложения...';
      document.getElementById('btnSkip').style.display = 'none';
    });

    window.setupAPI.onError((errorMessage) => {
      if (currentStep) setStepState(currentStep, 'error');
      const errorBox = document.getElementById('errorBox');
      errorBox.textContent = errorMessage;
      errorBox.classList.add('visible');
      document.getElementById('logLine').textContent = 'Ошибка загрузки. Модели скачаются при первом использовании.';
      document.getElementById('btnSkip').textContent = 'Закрыть';
    });
  </script>
</body>
</html>
