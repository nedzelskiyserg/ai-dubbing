name: Build Electron App (AI Dubbing Studio)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]  # Тег v1.0.1 и т.д. → создаёт GitHub Release для auto-update
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. Скачиваем код репозитория
    - name: Checkout repository
      uses: actions/checkout@v5

    # 2. Устанавливаем Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    # 3. Создаем .env файл из секрета (HF_TOKEN для диаризации)
    - name: Create .env file from GitHub Secret
      shell: pwsh
      run: |
        if ($env:HF_TOKEN -and $env:HF_TOKEN -ne "") {
          "HF_TOKEN=$env:HF_TOKEN" | Out-File -FilePath .env -Encoding utf8
          Write-Host "✅ .env файл создан из GitHub Secret"
        } else {
          Write-Host "⚠️ HF_TOKEN секрет не установлен в GitHub Secrets"
          "" | Out-File -FilePath .env -Encoding utf8
        }
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}

    # 4. Устанавливаем зависимости Node.js
    - name: Install Node.js dependencies
      working-directory: ./frontend
      run: npm install

    # 5. Собираем React приложение
    - name: Build React app
      working-directory: ./frontend
      run: npm run build
      env:
        CI: false
        GENERATE_SOURCEMAP: false

    # 6. Проверяем обязательные компоненты перед сборкой Electron
    - name: Verify required components
      shell: pwsh
      working-directory: ./frontend
      run: |
        Write-Host "🔍 Проверка обязательных компонентов..."
        $errorList = @()

        # Проверяем electron/main.js
        if (-not (Test-Path "electron\main.js")) {
          $errorList += "❌ electron/main.js не найден"
        } else {
          Write-Host "✅ electron/main.js найден"
        }

        # Проверяем dependency-manager.js
        if (-not (Test-Path "electron\dependency-manager.js")) {
          $errorList += "❌ electron/dependency-manager.js не найден"
        } else {
          Write-Host "✅ electron/dependency-manager.js найден"
        }

        # Проверяем setup.html
        if (-not (Test-Path "electron\setup.html")) {
          $errorList += "❌ electron/setup.html не найден"
        } else {
          Write-Host "✅ electron/setup.html найден"
        }

        # Проверяем React build
        if (-not (Test-Path "build\index.html")) {
          $errorList += "❌ React build не найден: build/index.html"
        } else {
          Write-Host "✅ React build найден"
        }

        # Проверяем Python исходники (будут включены как extraResources)
        if (-not (Test-Path "..\src\api_server.py")) {
          $errorList += "❌ src/api_server.py не найден"
        } else {
          Write-Host "✅ Python исходники найдены"
        }

        # Проверяем requirements.txt
        if (-not (Test-Path "..\requirements.txt")) {
          $errorList += "❌ requirements.txt не найден"
        } else {
          Write-Host "✅ requirements.txt найден"
        }

        if ($errorList.Count -gt 0) {
          Write-Host ""
          Write-Host "❌ КРИТИЧЕСКИЕ ОШИБКИ:"
          foreach ($err in $errorList) { Write-Host "  $err" }
          exit 1
        }

        Write-Host ""
        Write-Host "✅ Все компоненты проверены и готовы к сборке"

    # 7. Копируем .env в electron/ (будет внутри asar, доступен через __dirname)
    - name: Copy .env to electron directory
      shell: pwsh
      run: |
        if (Test-Path ".env") {
          Copy-Item ".env" -Destination "frontend/electron/.env" -Force
          Write-Host "✅ .env скопирован в frontend/electron/"
        } else {
          Write-Host "⚠️ .env не найден, пропускаем"
        }

    # 8. Собираем Electron приложение (+ публикуем Release при теге v*)
    - name: Build Electron app
      working-directory: ./frontend
      run: |
        Write-Host "🔨 Сборка Electron приложения..."
        npx electron-builder --win
      env:
        ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CI: false

    # 9. Проверяем созданные файлы
    - name: Verify build output
      shell: pwsh
      working-directory: ./frontend
      run: |
        Write-Host "📋 Проверка созданных файлов..."
        Get-ChildItem -Path dist-electron -Filter *.exe | ForEach-Object {
          Write-Host "  ✅ $($_.Name) ($([math]::Round($_.Length/1MB, 2)) MB)"
        }

    # 10. Загружаем установщик как артефакт
    - name: Upload Windows Installer
      uses: actions/upload-artifact@v5
      with:
        name: AI-Dubbing-Studio-Windows-Installer
        path: |
          frontend/dist-electron/*Setup*.exe
          frontend/dist-electron/latest.yml
        retention-days: 30
        if-no-files-found: error
